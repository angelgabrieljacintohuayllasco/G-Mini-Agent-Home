; G-Mini Home - companero WiFi (ESP32-S3 / ESP32 clasico)
;
; Entornos:
;   esp32s3-oled     ESP32-S3 + SSD1306 128x64 I2C + microfono + amplificador (+ anillo LED)
;   esp32s3-sh1106   igual, con OLED SH1106 (modulos de 1,3")
;   esp32s3-st7789   ESP32-S3 + pantalla a color ST7789 (240x280, 1.69")
;   esp32s3-gc9a01   ESP32-S3 + pantalla redonda GC9A01 (240x240, 1.28")
;   esp32s3-speaker  ESP32-S3 sin pantalla: la cara es el anillo LED
;   esp32dev-oled    ESP32 clasico (DevKit V1, sin PSRAM) + SSD1306
;   esp32dev-speaker ESP32 clasico sin pantalla
;   native           pruebas en el host (pio test -e native)
;
; Compilar:  pio run -e esp32s3-oled
; Grabar:    pio run -e esp32s3-oled -t upload
; Monitor:   pio device monitor

[platformio]
default_envs = esp32s3-oled
description = Companero fisico de G-Mini: cara animada, voz por pulsar-para-hablar y superficies de nodo

[esp32_base]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; arduinoWebSockets elige WiFi.h segun macros que el modo chain+ no evalua bien
lib_ldf_mode = deep
lib_deps =
  symlink://../libraries/GMiniEyes
  symlink://../libraries/GMiniLink
  bblanchon/ArduinoJson@^7.4.2
  links2004/WebSockets@^2.7.0
  tzapu/WiFiManager@^2.0.17
build_flags =
  -DGMINI_FW_NAME=\"gmini-home-esp32\"
  -DGMINI_FW_VERSION=\"0.1.0\"
  -DCORE_DEBUG_LEVEL=1
build_src_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter

[s3_base]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DGMINI_BOARD_S3=1

[env:esp32s3-oled]
extends = esp32_base, s3_base
lib_deps =
  ${esp32_base.lib_deps}
  olikraus/U8g2@^2.36.5
  adafruit/Adafruit NeoPixel@^1.15.1
build_flags =
  ${esp32_base.build_flags}
  ${s3_base.build_flags}
  -DGMINI_DISPLAY=GMINI_DISPLAY_OLED
  -DGMINI_LED_RING=1

[env:esp32s3-sh1106]
extends = esp32_base, s3_base
lib_deps =
  ${esp32_base.lib_deps}
  olikraus/U8g2@^2.36.5
  adafruit/Adafruit NeoPixel@^1.15.1
build_flags =
  ${esp32_base.build_flags}
  ${s3_base.build_flags}
  -DGMINI_DISPLAY=GMINI_DISPLAY_OLED
  -DGMINI_OLED_SH1106=1
  -DGMINI_LED_RING=1

[env:esp32s3-st7789]
extends = esp32_base, s3_base
lib_deps =
  ${esp32_base.lib_deps}
  lovyan03/LovyanGFX@^1.2.7
  olikraus/U8g2@^2.36.5
  adafruit/Adafruit NeoPixel@^1.15.1
build_flags =
  ${esp32_base.build_flags}
  ${s3_base.build_flags}
  -DGMINI_DISPLAY=GMINI_DISPLAY_ST7789
  -DGMINI_TFT_WIDTH=240
  -DGMINI_TFT_HEIGHT=280
  -DGMINI_TFT_OFFSET_Y=20
  -DGMINI_LED_RING=1

[env:esp32s3-gc9a01]
extends = esp32_base, s3_base
lib_deps =
  ${esp32_base.lib_deps}
  lovyan03/LovyanGFX@^1.2.7
  olikraus/U8g2@^2.36.5
  adafruit/Adafruit NeoPixel@^1.15.1
build_flags =
  ${esp32_base.build_flags}
  ${s3_base.build_flags}
  -DGMINI_DISPLAY=GMINI_DISPLAY_GC9A01
  -DGMINI_TFT_WIDTH=240
  -DGMINI_TFT_HEIGHT=240
  -DGMINI_LED_RING=1

[env:esp32s3-speaker]
extends = esp32_base, s3_base
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit NeoPixel@^1.15.1
build_flags =
  ${esp32_base.build_flags}
  ${s3_base.build_flags}
  -DGMINI_DISPLAY=GMINI_DISPLAY_NONE
  -DGMINI_LED_RING=1

[env:esp32dev-oled]
extends = esp32_base
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps =
  ${esp32_base.lib_deps}
  olikraus/U8g2@^2.36.5
  adafruit/Adafruit NeoPixel@^1.15.1
build_flags =
  ${esp32_base.build_flags}
  -DGMINI_BOARD_CLASSIC=1
  -DGMINI_DISPLAY=GMINI_DISPLAY_OLED
  -DGMINI_LED_RING=1

[env:esp32dev-speaker]
extends = esp32_base
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit NeoPixel@^1.15.1
build_flags =
  ${esp32_base.build_flags}
  -DGMINI_BOARD_CLASSIC=1
  -DGMINI_DISPLAY=GMINI_DISPLAY_NONE
  -DGMINI_LED_RING=1

[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
lib_deps =
  symlink://../libraries/GMiniEyes
  symlink://../libraries/GMiniLink
build_flags =
  -std=gnu++17
  -DGMINI_NATIVE=1
  -Wall
  -Wextra
