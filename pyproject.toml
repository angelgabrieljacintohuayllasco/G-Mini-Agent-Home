# Configuracion de herramientas para el codigo Python del repositorio
# (common/gmini_link, bridge/, raspberry-pi/, tools/). No es un paquete instalable:
# el puente y el cliente de Raspberry Pi se distribuyen como carpetas (ver release.yml).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["common", "bridge", "raspberry-pi", "tools/diagrams", "tools"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["common/gmini_link/eye_presets.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"bridge/gmini_serial_bridge.py" = ["E402", "I001"]
"raspberry-pi/gmini_pi/__main__.py" = ["E402", "I001"]
