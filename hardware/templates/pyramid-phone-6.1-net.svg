<svg xmlns="http://www.w3.org/2000/svg" width="186.0mm" height="162.0mm" viewBox="0 0 186.00 161.98">
  <title>Pirámide de Pepper - Teléfono 6,1"</title>
  <rect x="0" y="0" width="186.00" height="161.98" fill="#ffffff"/>
  <text x="12.0" y="16.0" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#1d2733">Pirámide de Pepper - Teléfono 6,1"</text>
  <text x="12.0" y="23.0" font-family="Arial, sans-serif" font-size="3.2" fill="#5b6b7b">Lado mayor b = 60 mm, lado menor a = 10 mm, alto del trapecio = 35.4 mm, altura = 25.0 mm</text>
  <text x="12.0" y="28.5" font-family="Arial, sans-serif" font-size="3.2" fill="#5b6b7b">Rojo: cortar. Azul punteado: marcar y doblar. Material: PET o acetato de 0,5 mm (o tapa de CD).</text>
  <text x="12.0" y="34.0" font-family="Arial, sans-serif" font-size="3.2" fill="#5b6b7b">Imprime al 100 % (sin ajustar a la página) y mide la regla antes de cortar.</text>
