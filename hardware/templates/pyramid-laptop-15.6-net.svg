  <title>Pirámide de Pepper - Portátil 15,6"</title>
  <rect x="0" y="0" width="308.58" height="364.47" fill="#ffffff"/>
  <text x="12.0" y="16.0" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#1d2733">Pirámide de Pepper - Portátil 15,6"</text>
  <text x="12.0" y="23.0" font-family="Arial, sans-serif" font-size="3.2" fill="#5b6b7b">Lado mayor b = 184 mm, lado menor a = 31 mm, alto del trapecio = 108.2 mm, altura = 76.5 mm</text>
  <text x="12.0" y="28.5" font-family="Arial, sans-serif" font-size="3.2" fill="#5b6b7b">Rojo: cortar. Azul punteado: marcar y doblar. Material: PETG o acrílico de 2 mm.</text>
  <text x="12.0" y="34.0" font-family="Arial, sans-serif" font-size="3.2" fill="#5b6b7b">Imprime al 100 % (sin ajustar a la página) y mide la regla antes de cortar.</text>
