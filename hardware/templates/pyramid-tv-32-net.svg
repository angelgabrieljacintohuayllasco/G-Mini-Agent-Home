  <title>Pirámide de Pepper - TV 32"</title>
  <rect x="0" y="0" width="607.26" height="681.27" fill="#ffffff"/>
  <text x="12.0" y="16.0" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#1d2733">Pirámide de Pepper - TV 32"</text>
  <text x="12.0" y="23.0" font-family="Arial, sans-serif" font-size="3.2" fill="#5b6b7b">Lado mayor b = 378 mm, lado menor a = 63 mm, alto del trapecio = 222.7 mm, altura = 157.5 mm</text>
  <text x="12.0" y="28.5" font-family="Arial, sans-serif" font-size="3.2" fill="#5b6b7b">Rojo: cortar. Azul punteado: marcar y doblar. Material: Acrílico de 3 mm con marco.</text>
  <text x="12.0" y="34.0" font-family="Arial, sans-serif" font-size="3.2" fill="#5b6b7b">Imprime al 100 % (sin ajustar a la página) y mide la regla antes de cortar.</text>
