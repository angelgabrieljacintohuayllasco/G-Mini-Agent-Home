  <title>Pirámide de Pepper - Teléfono 6,7"</title>
  <rect x="0" y="0" width="186.00" height="171.78" fill="#ffffff"/>
  <text x="12.0" y="16.0" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#1d2733">Pirámide de Pepper - Teléfono 6,7"</text>
  <text x="12.0" y="23.0" font-family="Arial, sans-serif" font-size="3.2" fill="#5b6b7b">Lado mayor b = 66 mm, lado menor a = 11 mm, alto del trapecio = 38.9 mm, altura = 27.5 mm</text>
  <text x="12.0" y="28.5" font-family="Arial, sans-serif" font-size="3.2" fill="#5b6b7b">Rojo: cortar. Azul punteado: marcar y doblar. Material: PET o acetato de 0,5 mm.</text>
  <text x="12.0" y="34.0" font-family="Arial, sans-serif" font-size="3.2" fill="#5b6b7b">Imprime al 100 % (sin ajustar a la página) y mide la regla antes de cortar.</text>
