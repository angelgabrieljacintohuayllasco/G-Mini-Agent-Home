<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="Imagen aérea con retrorreflector">
  <title>Imagen aérea con retrorreflector</title>
  <desc>Divisor de haz y lamina retrorreflectante forman una imagen real en el aire.</desc>
  <defs>
    <marker id="ray-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5c6"/></marker>
    <clipPath id="aer-ghost"><rect x="170" y="276" width="115.2" height="57.6" rx="11.8"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="32" y="44" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2733" text-anchor="start">Imagen aérea (retrorreflector + divisor de haz)</text>
  <text x="32" y="68" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6b7b" text-anchor="start">La luz rebota en una lámina retrorreflectante, vuelve por el divisor y se enfoca en el aire: imagen real</text>
  <rect x="380" y="470" width="150" height="16" rx="4" fill="#16232d"/>
  <rect x="395" y="466" width="120" height="5" fill="#3fe0ff" opacity="0.9"/>
  <text x="455" y="510" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b7b" text-anchor="middle">pantalla boca arriba</text>
  <line x1="330" y1="420" x2="560" y2="190" fill="none" stroke="#7cc4d6" stroke-width="5" stroke-linecap="round" />
  <text x="570" y="182" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1d2733" text-anchor="start">divisor de haz (vidrio 50/50)</text>
  <rect x="690" y="190" width="12" height="240" fill="#d6d9dc" stroke="#9aa1a7" stroke-width="1"/>
  <text x="712" y="320" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1d2733" text-anchor="start">lámina</text>
  <text x="712" y="336" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1d2733" text-anchor="start">retrorreflectante</text>
  <line x1="445" y1="466" x2="445" y2="305" fill="none" stroke="#0ea5c6" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="round" />
  <line x1="445" y1="305" x2="688" y2="305" fill="none" stroke="#0ea5c6" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="butt" marker-end="url(#ray-arrow)"/>
  <line x1="688" y1="312" x2="452" y2="312" fill="none" stroke="#0ea5c6" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="round" />
  <line x1="452" y1="312" x2="300" y2="312" fill="none" stroke="#0ea5c6" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="butt" marker-end="url(#ray-arrow)"/>
  <g opacity="0.55">
    <rect x="170" y="276" width="115.2" height="57.6" rx="11.8" fill="#e8fbff"/>
    <g clip-path="url(#aer-ghost)">
      <rect x="189.26" y="284.64" width="35.28" height="37.08" rx="8.64" fill="#bdeff9"/>
      <rect x="190.7" y="286.08" width="32.4" height="34.2" rx="7.2" fill="#3fe0ff"/>
      <circle cx="206.9" cy="326.08" r="21.53" fill="#e8fbff"/>
      <rect x="230.66" y="284.64" width="35.28" height="37.08" rx="8.64" fill="#bdeff9"/>
      <rect x="232.1" y="286.08" width="32.4" height="34.2" rx="7.2" fill="#3fe0ff"/>
      <circle cx="248.3" cy="326.08" r="21.53" fill="#e8fbff"/>
    </g>
  </g>
  <rect x="166" y="272" width="123.2" height="65.6" rx="10" fill="none" stroke="#0ea5c6" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="228" y="380" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#0b7285" text-anchor="middle">imagen real en el aire</text>
  <ellipse cx="70" cy="312" rx="20" ry="12" fill="#ffffff" stroke="#1d2733" stroke-width="1.6"/>
  <circle cx="76" cy="312" r="6.5" fill="#0b7285"/>
  <circle cx="76" cy="312" r="2.6" fill="#1d2733"/>
  <text x="70" y="344" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="middle">observador</text>
  <line x1="32" y1="566" x2="968" y2="566" fill="none" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round" />
  <text x="32" y="586" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="start">Más tenue que Pepper pero se puede 'tocar': la imagen queda delante del vidrio</text>
  <text x="968" y="586" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="end">G-Mini Home  |  CC BY-SA 4.0</text>
</svg>
