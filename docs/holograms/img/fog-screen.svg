<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="Pantalla de niebla">
  <title>Pantalla de niebla</title>
  <desc>Cortina laminar de niebla ultrasonica con proyector trasero.</desc>
  <defs>
    <linearGradient id="fog" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e9f6fb" stop-opacity="0.95"/><stop offset="1" stop-color="#e9f6fb" stop-opacity="0"/></linearGradient>
    <clipPath id="fog-ghost"><rect x="394" y="220" width="192" height="96" rx="13"/></clipPath>
    <marker id="ray-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5c6"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="32" y="44" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2733" text-anchor="start">Pantalla de niebla</text>
  <text x="32" y="68" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6b7b" text-anchor="start">Un nebulizador ultrasónico llena un depósito; ventiladores y una rejilla de pajillas forman una cortina fina</text>
  <rect x="330" y="420" width="320" height="70" rx="8" fill="#e7eef2" stroke="#c9d1d9" stroke-width="1.5"/>
  <rect x="340" y="460" width="300" height="22" rx="4" fill="#9fd9ef" opacity="0.8"/>
  <text x="490" y="450" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1d2733" text-anchor="middle">depósito con nebulizador</text>
  <rect x="350" y="394" width="10" height="26" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
  <rect x="379" y="394" width="10" height="26" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
  <rect x="408" y="394" width="10" height="26" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
  <rect x="437" y="394" width="10" height="26" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
  <rect x="466" y="394" width="10" height="26" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
  <rect x="495" y="394" width="10" height="26" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
  <rect x="524" y="394" width="10" height="26" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
  <rect x="553" y="394" width="10" height="26" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
  <rect x="582" y="394" width="10" height="26" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
  <rect x="611" y="394" width="10" height="26" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
  <text x="660" y="412" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="start">rejilla de pajillas (flujo laminar)</text>
  <rect x="550" y="490" width="60" height="26" rx="4" fill="#b8c4cc"/>
  <text x="580" y="532" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="middle">ventilador 12 V</text>
  <rect x="345" y="150" width="290" height="244" fill="url(#fog)"/>
  <g opacity="0.55">
    <rect x="394" y="220" width="192" height="96" rx="13" fill="#e8fbff"/>
    <g clip-path="url(#fog-ghost)">
      <rect x="426.1" y="234.4" width="58.8" height="61.8" rx="14.4" fill="#bdeff9"/>
      <rect x="428.5" y="236.8" width="54" height="57" rx="12" fill="#3fe0ff"/>
      <circle cx="455.5" cy="303.46" r="35.88" fill="#e8fbff"/>
      <rect x="495.1" y="234.4" width="58.8" height="61.8" rx="14.4" fill="#bdeff9"/>
      <rect x="497.5" y="236.8" width="54" height="57" rx="12" fill="#3fe0ff"/>
      <circle cx="524.5" cy="303.46" r="35.88" fill="#e8fbff"/>
    </g>
  </g>
  <rect x="390" y="216" width="200" height="104" rx="10" fill="none" stroke="#0ea5c6" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="780" y="274" width="90" height="52" rx="8" fill="#2f3b44"/>
  <circle cx="780" cy="300" r="14" fill="#9fe7f7"/>
  <text x="825" y="348" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b7b" text-anchor="middle">proyector</text>
  <line x1="766" y1="300" x2="630" y2="270" fill="none" stroke="#0ea5c6" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="butt" marker-end="url(#ray-arrow)"/>
  <line x1="766" y1="300" x2="630" y2="330" fill="none" stroke="#0ea5c6" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="butt" marker-end="url(#ray-arrow)"/>
  <ellipse cx="160" cy="300" rx="20" ry="12" fill="#ffffff" stroke="#1d2733" stroke-width="1.6"/>
  <circle cx="166" cy="300" r="6.5" fill="#0b7285"/>
  <circle cx="166" cy="300" r="2.6" fill="#1d2733"/>
  <text x="160" y="332" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="middle">observador</text>
  <rect x="40" y="470" width="250" height="79.8" rx="8" fill="#fff0f0" stroke="#c92a2a" stroke-width="1"/>
  <rect x="40" y="470" width="4" height="79.8" rx="2" fill="#c92a2a"/>
  <text x="54" y="489" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c92a2a" text-anchor="start">Agua y electricidad</text>
  <text x="54" y="504.95" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">Nunca acerques agua o niebla a</text>
  <text x="54" y="520.9" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">la fuente de 220 V ni al proyector.</text>
  <text x="54" y="536.85" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">Usa agua destilada (sin minerales).</text>
  <line x1="32" y1="566" x2="968" y2="566" fill="none" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round" />
  <text x="32" y="586" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="start">Proyección trasera: el observador ve la imagen en la niebla con el proyector al otro lado</text>
  <text x="968" y="586" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="end">G-Mini Home  |  CC BY-SA 4.0</text>
</svg>
