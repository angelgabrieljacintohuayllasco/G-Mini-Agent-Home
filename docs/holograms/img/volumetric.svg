<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="Pantalla volumétrica de barrido">
  <title>Pantalla volumétrica de barrido</title>
  <desc>Superficie giratoria iluminada por un proyector rapido.</desc>
  <defs>
    <marker id="ray-arrow-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
    <marker id="ray-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5c6"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="32" y="44" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2733" text-anchor="start">Volumétrica de barrido (espejo o pantalla giratoria)</text>
  <text x="32" y="68" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6b7b" text-anchor="start">Una superficie gira a alta velocidad y un proyector rápido dibuja en cada ángulo una rebanada de la imagen</text>
  <ellipse cx="430" cy="440" rx="170" ry="26" fill="#e7eef2" stroke="#c9d1d9" stroke-width="1.5"/>
  <rect x="424" y="270" width="12" height="170" fill="#9aa8b2"/>
  <polygon points="320,160 540,220 540,380 320,320" fill="#cfeef7" stroke="#7cc4d6" stroke-width="2" opacity="0.8" stroke-linejoin="round" />
  <path d="M280,120 A160,40 0 0 1 580,120" fill="none" stroke="#5b6b7b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ray-arrow-m)"/>
  <rect x="400" y="480" width="60" height="34" rx="6" fill="#2f3b44"/>
  <text x="430" y="534" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="middle">proyector DLP de alta frecuencia</text>
  <line x1="430" y1="480" x2="370" y2="330" fill="none" stroke="#0ea5c6" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="butt" marker-end="url(#ray-arrow)"/>
  <line x1="430" y1="480" x2="490" y2="350" fill="none" stroke="#0ea5c6" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="butt" marker-end="url(#ray-arrow)"/>
  <text x="630" y="140" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2733" text-anchor="start">giro de 600-1200 RPM</text>
  <rect x="660" y="300" width="300" height="79.8" rx="8" fill="#fff4e6" stroke="#c2410c" stroke-width="1"/>
  <rect x="660" y="300" width="4" height="79.8" rx="2" fill="#c2410c"/>
  <text x="674" y="319" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="start">Proyecto avanzado</text>
  <text x="674" y="334.95" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">Prototipo de investigación: exige</text>
  <text x="674" y="350.9" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">equilibrado fino, eje robusto y</text>
  <text x="674" y="366.85" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">una cubierta transparente cerrada.</text>
  <line x1="32" y1="566" x2="968" y2="566" fill="none" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round" />
  <text x="32" y="586" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="start">Única técnica de la lista con volumen real: se ve en 3D desde cualquier lado</text>
  <text x="968" y="586" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="end">G-Mini Home  |  CC BY-SA 4.0</text>
</svg>
