<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="LCD transparente">
  <title>LCD transparente</title>
  <desc>Vista explotada de un LCD sin retroiluminacion delante de una caja de luz.</desc>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="32" y="44" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2733" text-anchor="start">LCD transparente</text>
  <text x="32" y="68" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6b7b" text-anchor="start">Un LCD sin luz trasera ni difusor deja ver lo que hay detrás: los píxeles oscuros "flotan" sobre el fondo</text>
  <polygon points="330,160 364,130 364,410 330,440" fill="#9fb3c0" stroke="#7a8a95" stroke-width="1.2" opacity="0.9" stroke-linejoin="round" />
  <text x="347" y="466" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#1d2733" text-anchor="middle">Polarizador</text>
  <text x="347" y="482" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7b" text-anchor="middle">frontal</text>
  <polygon points="425,160 459,130 459,410 425,440" fill="#cfeef7" stroke="#7a8a95" stroke-width="1.2" opacity="0.95" stroke-linejoin="round" />
  <text x="442" y="466" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#1d2733" text-anchor="middle">Vidrio LCD</text>
  <text x="442" y="482" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7b" text-anchor="middle">(píxeles)</text>
  <polygon points="520,160 554,130 554,410 520,440" fill="#9fb3c0" stroke="#7a8a95" stroke-width="1.2" opacity="0.9" stroke-linejoin="round" />
  <text x="537" y="466" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#1d2733" text-anchor="middle">Polarizador</text>
  <text x="537" y="482" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5b6b7b" text-anchor="middle">trasero</text>
  <polygon points="615,160 649,130 649,410 615,440" fill="#f1f3f5" stroke="#7a8a95" stroke-width="1.2" opacity="0.6" stroke-dasharray="5 4" stroke-linejoin="round" />
  <text x="632" y="466" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#c92a2a" text-anchor="middle">Difusor</text>
  <text x="632" y="482" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#c92a2a" text-anchor="middle">(se retira)</text>
  <polygon points="710,160 744,130 744,410 710,440" fill="#fff3c4" stroke="#7a8a95" stroke-width="1.2" opacity="0.6" stroke-dasharray="5 4" stroke-linejoin="round" />
  <text x="727" y="466" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#c92a2a" text-anchor="middle">Retroiluminación</text>
  <text x="727" y="482" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#c92a2a" text-anchor="middle">(se retira)</text>
  <rect x="820" y="150" width="110" height="270" rx="10" fill="#fffbe6" stroke="#e2c86a" stroke-width="1.5"/>
  <text x="875" y="280" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#8a6d10" text-anchor="middle">caja de luz</text>
  <text x="875" y="298" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#8a6d10" text-anchor="middle">o tira LED</text>
  <text x="875" y="314" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#8a6d10" text-anchor="middle">+ difusor</text>
  <ellipse cx="200" cy="280" rx="20" ry="12" fill="#ffffff" stroke="#1d2733" stroke-width="1.6"/>
  <circle cx="206" cy="280" r="6.5" fill="#0b7285"/>
  <circle cx="206" cy="280" r="2.6" fill="#1d2733"/>
  <text x="200" y="312" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="middle">observador</text>
  <rect x="40" y="410" width="260" height="127.65" rx="8" fill="#fff0f0" stroke="#c92a2a" stroke-width="1"/>
  <rect x="40" y="410" width="4" height="127.65" rx="2" fill="#c92a2a"/>
  <text x="54" y="429" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c92a2a" text-anchor="start">Seguridad al desarmar</text>
  <text x="54" y="444.95" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">Bordes de vidrio filosos: guantes</text>
  <text x="54" y="460.9" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">anticorte y lentes.</text>
  <text x="54" y="476.85" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">Alcohol isopropílico o calor suave para</text>
  <text x="54" y="492.8" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">despegar; nunca acetona en el vidrio.</text>
  <text x="54" y="508.75" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">Ventila: los adhesivos y solventes</text>
  <text x="54" y="524.7" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">desprenden vapores.</text>
  <line x1="32" y1="566" x2="968" y2="566" fill="none" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round" />
  <text x="32" y="586" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="start">Los polarizadores se quedan: sin ellos el LCD no muestra imagen</text>
  <text x="968" y="586" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="end">G-Mini Home  |  CC BY-SA 4.0</text>
</svg>
