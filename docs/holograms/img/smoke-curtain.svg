<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="Cortina de humo y viento">
  <title>Cortina de humo y viento</title>
  <desc>Humo de maquina de niebla guiado por un tunel de viento.</desc>
