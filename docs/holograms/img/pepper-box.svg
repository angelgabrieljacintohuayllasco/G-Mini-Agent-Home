  <circle cx="156" cy="267.65" r="2.6" fill="#1d2733"/>
  <text x="150" y="299.65" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="middle">observador</text>
  <line x1="560" y1="373.53" x2="720" y2="400" fill="none" stroke="#5b6b7b" stroke-width="1" stroke-linecap="round" />
  <circle cx="560" cy="373.53" r="2.6" fill="#1d2733"/>
  <text x="726" y="404" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2733" text-anchor="start">Placa a 45°</text>
  <text x="726" y="421" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="start">vidrio fino, acrílico o PET</text>
  <line x1="570" y1="250" x2="720" y2="250" fill="none" stroke="#5b6b7b" stroke-width="1" stroke-linecap="round" />
  <circle cx="570" cy="250" r="2.6" fill="#1d2733"/>
  <text x="726" y="254" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2733" text-anchor="start">Imagen virtual</text>
  <text x="726" y="271" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="start">detrás de la placa</text>
  <line x1="656" y1="330" x2="720" y2="325" fill="none" stroke="#5b6b7b" stroke-width="1" stroke-linecap="round" />
  <circle cx="656" cy="330" r="2.6" fill="#1d2733"/>
  <text x="726" y="329" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2733" text-anchor="start">Interior negro mate</text>
  <text x="726" y="346" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="start">más contraste</text>
  <text x="720" y="480" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1d2733" text-anchor="start">Placa: ancho de pantalla x (profundidad x 1,41)</text>
  <line x1="32" y1="566" x2="968" y2="566" fill="none" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round" />
  <text x="32" y="586" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="start">Con gmini_pi --layout mirror la imagen sale espejada para que el reflejo se lea bien</text>
  <text x="968" y="586" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="end">G-Mini Home  |  CC BY-SA 4.0</text>
