  <rect x="290" y="446" width="360" height="16" rx="4" fill="#16232d"/>
  <rect x="310" y="440" width="320" height="6" fill="#3fe0ff" opacity="0.85"/>
  <text x="470" y="504" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7b" text-anchor="middle">pantalla boca arriba en el piso de la caja</text>
  <line x1="300" y1="190" x2="640" y2="430" fill="none" stroke="#7cc4d6" stroke-width="5" stroke-linecap="round" />
  <g opacity="0.55">
    <rect x="480" y="210" width="121.6" height="60.8" rx="11.9" fill="#e8fbff"/>
    <g clip-path="url(#box-ghost)">
      <rect x="500.33" y="219.12" width="37.24" height="39.14" rx="9.12" fill="#bdeff9"/>
      <rect x="501.85" y="220.64" width="34.2" height="36.1" rx="7.6" fill="#3fe0ff"/>
      <circle cx="518.95" cy="262.86" r="22.72" fill="#e8fbff"/>
      <rect x="544.03" y="219.12" width="37.24" height="39.14" rx="9.12" fill="#bdeff9"/>
      <rect x="545.55" y="220.64" width="34.2" height="36.1" rx="7.6" fill="#3fe0ff"/>
      <circle cx="562.65" cy="262.86" r="22.72" fill="#e8fbff"/>
    </g>
  </g>
  <rect x="476" y="206" width="129.6" height="68.8" rx="10" fill="none" stroke="#0ea5c6" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="410" y1="438" x2="410" y2="267.65" fill="none" stroke="#0ea5c6" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="round" />
  <line x1="410" y1="267.65" x2="190" y2="267.65" fill="none" stroke="#0ea5c6" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="butt" marker-end="url(#ray-arrow)"/>
