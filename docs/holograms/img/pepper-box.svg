<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="Caja de Pepper">
  <title>Caja de Pepper</title>
  <desc>Placa unica a 45 grados dentro de una caja oscura.</desc>
  <defs>
    <clipPath id="box-ghost"><rect x="480" y="210" width="121.6" height="60.8" rx="11.9"/></clipPath>
    <marker id="ray-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5c6"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="32" y="44" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2733" text-anchor="start">Caja de Pepper (una placa a 45°)</text>
  <text x="32" y="68" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6b7b" text-anchor="start">La técnica de los teatros del siglo XIX: la pantalla queda oculta y su reflejo aparece dentro de la caja</text>
  <rect x="260" y="150" width="420" height="330" rx="8" fill="#2a3640" stroke="#11181e" stroke-width="2"/>
