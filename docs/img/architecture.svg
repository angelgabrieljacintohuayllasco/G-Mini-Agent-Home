<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Arquitectura de G-Mini Home">
  <title>Arquitectura de G-Mini Home</title>
  <desc>Dispositivos de G-Mini Home conectados al nucleo de G-Mini por la Remote API v1.</desc>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7285"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
  <text x="32" y="44" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2733" text-anchor="start">Cómo se conecta todo</text>
  <text x="32" y="68" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6b7b" text-anchor="start">La carita escucha y muestra; el trabajo real corre en el núcleo de G-Mini (PC o servidor 24/7)</text>
  <rect x="433" y="124" width="340" height="250" rx="16" fill="#000000" opacity="0.07"/>
  <rect x="430" y="120" width="340" height="250" rx="16" fill="#0f2533"/>
