  <text x="454" y="178" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a9c2cf" text-anchor="start">Escritorio (Windows) o servidor 24/7 (Linux)</text>
  <circle cx="460" cy="210" r="3" fill="#3fe0ff"/>
  <text x="472" y="214" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6fbff" text-anchor="start">Agente, memoria, tareas y conectores</text>
  <circle cx="460" cy="236" r="3" fill="#3fe0ff"/>
  <text x="472" y="240" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6fbff" text-anchor="start">STT (Whisper) y TTS (voces neurales)</text>
  <circle cx="460" cy="262" r="3" fill="#3fe0ff"/>
  <text x="472" y="266" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6fbff" text-anchor="start">Remote API v1 en el puerto 8765</text>
  <circle cx="460" cy="288" r="3" fill="#3fe0ff"/>
  <text x="472" y="292" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6fbff" text-anchor="start">Tokens por dispositivo y aprobaciones</text>
